name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Skip the supabase CLI binary download and other postinstall hooks; not needed for checks.
  SUPABASE_INTERNAL_SKIP_POSTINSTALL: "1"

jobs:
  check:
    name: typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: e2e on mocks (laptop)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: check
    continue-on-error: true
    env:
      NEXT_PUBLIC_USE_MOCKS: "true"
      AGENTS_MODE: scripted
      MEMORY_STORE_FILE: none
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=laptop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
